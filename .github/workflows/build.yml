name: Verify and package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm audit --audit-level=high
  desktop:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            artifact: windows-x64-unsigned-preview
          - os: macos-latest
            target: universal-apple-darwin
            bundle: app,dmg
            artifact: mac-universal-unsigned-preview
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install universal Mac targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build unsigned pull request preview
        if: github.event_name == 'pull_request'
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} --config src-tauri/tauri.pr.conf.json
      - name: Build signed update packages
        if: github.event_name != 'pull_request'
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
      - name: Verify Windows application launch
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-launch-smoke.ps1
      - name: Verify signed update payloads
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $bundleRoot = 'src-tauri/target/${{ matrix.target }}/release/bundle'
          $suffix = if ('${{ runner.os }}' -eq 'Windows') { '.exe' } else { '.app.tar.gz' }
          $payloads = @(Get-ChildItem -LiteralPath $bundleRoot -Recurse -File | Where-Object { $_.Name.EndsWith($suffix) })
          if ($payloads.Count -ne 1) { throw "Expected one update payload ending in $suffix; found $($payloads.Count)" }
          if (-not (Test-Path -LiteralPath ($payloads[0].FullName + '.sig'))) { throw 'Update signature is missing' }
          Write-Output "Signed update payload present: $($payloads[0].Name)"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/**/bundle/nsis/*.exe
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/nsis/*.exe.sig
            src-tauri/target/**/bundle/macos/*.app.tar.gz
            src-tauri/target/**/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 14
