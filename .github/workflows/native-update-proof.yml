name: Native signed update proof

on:
  workflow_call:
    inputs:
      from:
        type: string
        default: v0.2.0-alpha.4
      to:
        type: string
        default: v0.2.0-alpha.5
  workflow_dispatch:
    inputs:
      from:
        description: Published native preview to install first
        type: string
        default: v0.2.0-alpha.4
      to:
        description: Newest published native preview to receive through the updater
        type: string
        default: v0.2.0-alpha.5

permissions:
  contents: read

jobs:
  installed-update:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Provide software OpenGL for the hosted desktop
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'mesa3d-23.3.5-release-msvc.7z'
          $mesa = Join-Path $env:RUNNER_TEMP 'native-update-mesa'
          Invoke-WebRequest -Uri 'https://github.com/pal1000/mesa-dist-win/releases/download/23.3.5/mesa3d-23.3.5-release-msvc.7z' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne 'CE42BEE2034F3DBD272F1D658040DFA678C0D8E653F260BE8808F4E80F34C06A') { throw 'CI Mesa checksum mismatch' }
          & 'C:\Program Files\7-Zip\7z.exe' x $archive "-o$mesa" 'x64/opengl32.dll' 'x64/libglapi.dll' 'x64/libgallium_wgl.dll'
          if ($LASTEXITCODE -ne 0) { throw 'CI Mesa extraction failed' }
          'GALLIUM_DRIVER=llvmpipe' | Add-Content -LiteralPath $env:GITHUB_ENV
      - name: Prove real signed release update, profile retention and native controls
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          FROM_TAG: ${{ inputs.from }}
          TO_TAG: ${{ inputs.to }}
        run: |
          ./scripts/native-update-proof.ps1 -FromTag $env:FROM_TAG -ToTag $env:TO_TAG -OutputDirectory "$env:RUNNER_TEMP/native-update-proof" -MesaDirectory "$env:RUNNER_TEMP/native-update-mesa/x64"
      - name: Upload update receipt and native screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-signed-update-proof
          path: ${{ runner.temp }}/native-update-proof/**
          if-no-files-found: error
          retention-days: 30
