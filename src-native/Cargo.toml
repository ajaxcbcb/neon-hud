[package]
name = "neon-hud-native"
version = "0.2.0-alpha.3"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Native floating desktop instruments for Neon HUD"

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "accesskit", "x11", "wayland"] }
neon-hud = { path = "../src-tauri", default-features = false }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
base64 = "0.22"
semver = "1"
fs2 = "0.4"
ureq = "3.4"
minisign-verify = "0.3"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
directories = "6"
tray-icon = "0.21"
auto-launch = "0.6"
open = "5"
display-info = "=0.5.9"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
