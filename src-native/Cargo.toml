[package]
name = "neon-hud-native"
version = "0.2.0-alpha.6"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Native floating desktop instruments for Neon HUD"

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "accesskit", "x11", "wayland"] }
neon-hud = { path = "../src-tauri", default-features = false }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
base64 = "0.22"
semver = "1"
fs2 = "0.4"
ureq = "3.4"
minisign-verify = "0.3"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
directories = "6"
tray-icon = "0.21"
auto-launch = "0.6"
open = "5"
display-info = "=0.5.9"
chrono = "0.4"
chrono-tz = "0.10"
rrule = "0.14"

[target.'cfg(target_os="windows")'.dependencies]
windows = { version = "=0.61.3", features = ["Foundation", "Foundation_Collections", "Graphics_Imaging", "Media_Capture", "Media_Capture_Frames", "Media_Control", "Media_MediaProperties", "Storage_Streams", "Win32_System_Com", "Win32_System_Power"] }
windows-future = "=0.2.1"

[target.'cfg(target_os="macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6"

[patch.crates-io]
winit = { path = "vendor/winit" }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
