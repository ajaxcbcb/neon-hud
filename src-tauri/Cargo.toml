[package]
name = "neon-hud"
version = "0.1.4"
description = "Local system and AI allowance HUD"
authors = ["Neon HUD contributors"]
license = "MIT OR Apache-2.0"
edition = "2021"

[lib]
name = "neon_hud_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "neon-hud"
path = "src/main.rs"
required-features = ["desktop-webview"]

[features]
default = ["desktop-webview"]
desktop-webview = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-opener", "dep:tauri-plugin-autostart", "dep:tauri-plugin-notification", "dep:tauri-plugin-updater"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"
default-net = "0.22"
sha2 = "0.10"
open = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_Storage_FileSystem"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_System_Performance"] }
